# Apache 2.4: protect runtime data and source files even with AllowOverride None.
<Directory "/var/www/html/HomeNetScanner">
    Options -Indexes
    <FilesMatch "(?i)(^\.|\.(?:py|pyc|json|log|txt|md|conf)(?:\..*)?$)">
        Require all denied
    </FilesMatch>
</Directory>

<DirectoryMatch "^/var/www/html/HomeNetScanner/(?:[^/]+/)*(?:\.[^/]+|__pycache__|tests|deploy)(?:/|$)">
    Require all denied
</DirectoryMatch>
